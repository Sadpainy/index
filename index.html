<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OvO</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "SF Mono", "Fira Code", "JetBrains Mono", Consolas, Monaco, monospace;
      line-height: 1.9;
      color: #e0e0e0;
      background: #02020a;
      padding: 72px 24px;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      top: -60%;
      left: -60%;
      width: 220%;
      height: 220%;
      background:
        radial-gradient(circle at 10% 20%, rgba(255, 0, 128, 0.28) 0%, transparent 30%),
        radial-gradient(circle at 90% 15%, rgba(0, 255, 255, 0.24) 0%, transparent 30%),
        radial-gradient(circle at 20% 85%, rgba(255, 200, 0, 0.22) 0%, transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(0, 255, 128, 0.24) 0%, transparent 30%),
        radial-gradient(circle at 50% 45%, rgba(160, 0, 255, 0.22) 0%, transparent 35%),
        radial-gradient(circle at 65% 10%, rgba(255, 100, 0, 0.18) 0%, transparent 28%),
        radial-gradient(circle at 35% 55%, rgba(0, 100, 255, 0.20) 0%, transparent 30%),
        radial-gradient(circle at 85% 45%, rgba(255, 0, 255, 0.18) 0%, transparent 28%);
      animation: glowDrift 14s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes glowDrift {
      0% { transform: translate(0, 0) scale(1) rotate(0deg); }
      100% { transform: translate(-8%, -8%) scale(1.18) rotate(6deg); }
    }

    body::after {
      content: "";
      position: fixed;
      top: -60%;
      left: -60%;
      width: 220%;
      height: 220%;
      background:
        radial-gradient(circle at 70% 30%, rgba(0, 255, 200, 0.16) 0%, transparent 30%),
        radial-gradient(circle at 30% 70%, rgba(255, 0, 100, 0.16) 0%, transparent 30%),
        radial-gradient(circle at 55% 85%, rgba(200, 255, 0, 0.14) 0%, transparent 28%),
        radial-gradient(circle at 15% 45%, rgba(100, 0, 255, 0.16) 0%, transparent 30%);
      animation: glowDriftReverse 18s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes glowDriftReverse {
      0% { transform: translate(0, 0) scale(1.1) rotate(0deg); }
      100% { transform: translate(8%, 6%) scale(1) rotate(-8deg); }
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    header {
      margin-bottom: 56px;
      padding-bottom: 32px;
      border-bottom: 2px solid transparent;
      border-image: linear-gradient(90deg, #ff0080, #ff8c00, #ffd700, #00ff88, #00ffff, #0080ff, #a000ff, #ff00ff, #ff0080) 1;
      animation: borderFlow 5s linear infinite;
    }

    @keyframes borderFlow {
      0% { border-image-source: linear-gradient(90deg, #ff0080, #ff8c00, #ffd700, #00ff88, #00ffff, #0080ff, #a000ff, #ff00ff, #ff0080); }
      100% { border-image-source: linear-gradient(270deg, #ff0080, #ff8c00, #ffd700, #00ff88, #00ffff, #0080ff, #a000ff, #ff00ff, #ff0080); }
    }

    h1 {
      font-size: 3.4rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #fff;
      text-shadow:
        0 0 4px #fff,
        0 0 8px #ff0080,
        0 0 16px #ff0080,
        0 0 28px #ff0080,
        0 0 44px #ff0080,
        0 0 60px rgba(255, 0, 128, 0.6),
        0 0 80px rgba(160, 0, 255, 0.4),
        0 0 100px rgba(0, 255, 255, 0.3);
      animation: flicker 5s infinite alternate;
    }

    @keyframes flicker {
      0%, 15%, 19%, 23%, 51%, 55%, 100% {
        text-shadow:
          0 0 4px #fff,
          0 0 8px #ff0080,
          0 0 16px #ff0080,
          0 0 28px #ff0080,
          0 0 44px #ff0080,
          0 0 60px rgba(255, 0, 128, 0.6),
          0 0 80px rgba(160, 0, 255, 0.4);
      }
      17%, 21%, 53% {
        text-shadow:
          0 0 3px #fff,
          0 0 6px #ff0080,
          0 0 12px #ff0080,
          0 0 20px #ff0080,
          0 0 32px rgba(255, 0, 128, 0.4);
      }
    }

    .subtitle {
      margin-top: 14px;
      font-size: 0.85rem;
      letter-spacing: 0.18em;
      color: #fff;
      animation: colorCycle 6s linear infinite;
    }

    @keyframes colorCycle {
      0% { color: #ff0080; text-shadow: 0 0 6px #ff0080, 0 0 12px #ff0080, 0 0 24px rgba(255, 0, 128, 0.6); }
      14% { color: #ff8c00; text-shadow: 0 0 6px #ff8c00, 0 0 12px #ff8c00, 0 0 24px rgba(255, 140, 0, 0.6); }
      28% { color: #ffd700; text-shadow: 0 0 6px #ffd700, 0 0 12px #ffd700, 0 0 24px rgba(255, 215, 0, 0.6); }
      42% { color: #00ff88; text-shadow: 0 0 6px #00ff88, 0 0 12px #00ff88, 0 0 24px rgba(0, 255, 136, 0.6); }
      57% { color: #00ffff; text-shadow: 0 0 6px #00ffff, 0 0 12px #00ffff, 0 0 24px rgba(0, 255, 255, 0.6); }
      71% { color: #0080ff; text-shadow: 0 0 6px #0080ff, 0 0 12px #0080ff, 0 0 24px rgba(0, 128, 255, 0.6); }
      85% { color: #a000ff; text-shadow: 0 0 6px #a000ff, 0 0 12px #a000ff, 0 0 24px rgba(160, 0, 255, 0.6); }
      100% { color: #ff0080; text-shadow: 0 0 6px #ff0080, 0 0 12px #ff0080, 0 0 24px rgba(255, 0, 128, 0.6); }
    }

    h2 {
      font-size: 1rem;
      font-weight: 600;
      margin-top: 48px;
      margin-bottom: 20px;
      letter-spacing: 0.16em;
      animation: colorCycle 8s linear infinite;
    }

    h2::before {
      content: "";
      animation: colorCycle 4s linear infinite reverse;
    }

    p {
      font-size: 0.92rem;
      margin-bottom: 18px;
      letter-spacing: 0.02em;
      animation: colorCycle 10s linear infinite;
      animation-delay: 0.5s;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      margin: 12px 0;
      font-size: 0.92rem;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      transition: padding-left 0.3s ease, border-color 0.3s ease, background 0.3s ease;
    }

    li:hover {
      padding-left: 14px;
      border-bottom-color: #ff0080;
      background: linear-gradient(90deg, rgba(255, 0, 128, 0.1), rgba(0, 255, 255, 0.05), transparent);
    }

    a {
      text-decoration: none;
      font-weight: 500;
      letter-spacing: 0.03em;
      animation: colorCycle 5s linear infinite;
    }

    a:hover {
      color: #fff !important;
      text-shadow:
        0 0 6px #fff,
        0 0 12px #ff0080,
        0 0 24px #ff0080,
        0 0 40px rgba(255, 0, 128, 0.8),
        0 0 60px rgba(160, 0, 255, 0.5) !important;
      animation: none;
    }

    .tag {
      font-size: 0.72rem;
      margin-left: 12px;
      letter-spacing: 0.08em;
      animation: colorCycle 12s linear infinite;
      animation-delay: 1s;
    }

    footer {
      margin-top: 72px;
      padding-top: 28px;
      border-top: 2px solid transparent;
      border-image: linear-gradient(90deg, #ff0080, #ffd700, #00ff88, #00ffff, #0080ff, #a000ff, #ff00ff, #ff0080) 1;
      font-size: 0.8rem;
      letter-spacing: 0.18em;
      animation: colorCycle 7s linear infinite;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>OvO</h1>
      <p class="subtitle"></p>
    </header>

    <section>
      <h2>About me</h2>
      <p>I'm OvO. I build security tools and study low-level systems, mostly in C and Python. My work focuses on malware research, network tooling, and software that runs close to the hardware.</p>
      <p>Skilled in C, Python, and Shell.</p>
    </section>

    <section>
      <h2>Welcome projects</h2>
      <ul>
        <li><a href="https://github.com/Sadpainy/Stuxnet">Stuxnet</a><span class="tag"></span></li>
      </ul>
    </section>

    <footer>
      <p>OvO</p>
    </footer>
  </div>
</body>
</html>
